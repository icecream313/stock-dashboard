<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📈 나의 주식 대시보드</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1117">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="주식 대시보드">
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --card: #181b23;
    --border: #2a2e3a;
    --text: #e8eaf0;
    --muted: #8a90a3;
    --accent: #4f8cff;
    --up: #f04452;    /* 한국식: 상승 = 빨강 */
    --down: #3182f6;  /* 한국식: 하락 = 파랑 */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
    padding-bottom: 40px;
  }
  header {
    padding: 14px 20px 6px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.25rem; }
  header .date { color: var(--muted); font-size: 0.85rem; }
  header .refresh {
    margin-left: auto;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 14px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  header .refresh:hover { border-color: var(--accent); }
  .section { padding: 0 20px; margin-top: 22px; }
  .section h2 {
    font-size: 1rem;
    color: var(--muted);
    margin-bottom: 10px;
    letter-spacing: 0.04em;
  }
  /* 거시 지표 스트립 */
  .macro-strip {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 10px 20px 2px;
    scrollbar-width: thin;
  }
  .macro-chip {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    min-width: 128px;
    flex-shrink: 0;
  }
  .macro-chip .label { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
  .macro-chip .price { font-size: 1.02rem; font-weight: 700; margin-top: 2px; white-space: nowrap; }
  .macro-chip .chg { font-size: 0.78rem; white-space: nowrap; }
  .up { color: var(--up); }
  .down { color: var(--down); }
  .flat { color: var(--muted); }
  /* 관심종목 카드 */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px 10px;
    position: relative;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .card:hover { border-color: var(--accent); }
  .card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .card .del {
    position: absolute;
    top: 10px;
    right: 10px;
    background: none;
    color: var(--muted);
    border: none;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 4px;
  }
  .card .del:hover { color: var(--up); }
  .card .name { font-size: 0.95rem; font-weight: 600; padding-right: 24px; }
  .card .sym { font-size: 0.72rem; color: var(--muted); margin-top: 1px; }
  .card .price { font-size: 1.35rem; font-weight: 700; margin-top: 8px; }
  .card .chg { font-size: 0.85rem; margin-top: 2px; }
  .card canvas { width: 100%; height: 54px; margin-top: 10px; display: block; }
  .card .err { color: var(--muted); font-size: 0.8rem; margin-top: 14px; }
  /* 종목 추가 (검색) */
  .add-bar { display: flex; gap: 8px; margin-bottom: 14px; }
  .ac-wrap { position: relative; flex: 1; max-width: 520px; }
  .ac-wrap input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 11px 14px;
    font-size: 0.92rem;
  }
  .ac-wrap input:focus { outline: none; border-color: var(--accent); }
  .ac-results {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 50;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    max-height: 320px; overflow-y: auto;
  }
  .ac-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--border);
  }
  .ac-item:last-child { border-bottom: none; }
  .ac-item:hover { background: rgba(79,140,255,0.1); }
  .ac-item .nm { font-size: 0.9rem; font-weight: 600; }
  .ac-item .cd { font-size: 0.72rem; color: var(--muted); }
  .ac-item .mk {
    margin-left: auto; font-size: 0.68rem; color: var(--muted);
    border: 1px solid var(--border); border-radius: 5px; padding: 2px 7px; white-space: nowrap;
  }
  .ac-empty { padding: 13px 16px; color: var(--muted); font-size: 0.82rem; }
  /* 포트폴리오 요약 바 */
  .pf-bar {
    display: flex; gap: 22px; flex-wrap: wrap; align-items: baseline;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 18px;
  }
  .pf-bar .pf-item .k { font-size: 0.72rem; color: var(--muted); }
  .pf-bar .pf-item .v { font-size: 1.05rem; font-weight: 700; margin-top: 2px; }
  /* 관심종목 헤더 */
  .wl-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .wl-head h2 { margin-bottom: 0; }
  .wl-head select, .wl-head button {
    background: var(--card); border: 1px solid var(--border); color: var(--muted);
    border-radius: 8px; padding: 5px 10px; font-size: 0.78rem; cursor: pointer;
  }
  .wl-head select:hover, .wl-head button:hover { border-color: var(--accent); color: var(--text); }
  .wl-head button { margin-left: auto; }
  /* 보유 손익 표시 */
  .holding-line { font-size: 0.76rem; margin-top: 7px; color: var(--muted); }
  .holding-line b { font-size: 0.8rem; }
  /* 보유 입력 폼 (모달 개요 탭) */
  .holding-form {
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 13px 16px; margin-bottom: 14px;
  }
  .holding-form .hf-title { font-size: 0.8rem; font-weight: 700; margin-bottom: 9px; }
  .holding-form .hf-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .holding-form input {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    border-radius: 7px; padding: 7px 10px; font-size: 0.85rem; width: 130px;
  }
  .holding-form button {
    background: var(--accent); border: none; color: #fff; border-radius: 7px;
    padding: 7px 14px; font-size: 0.82rem; font-weight: 600; cursor: pointer;
  }
  .holding-form button.hf-del { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .holding-form .hf-result { font-size: 0.82rem; margin-top: 9px; }
  /* 카드 기간 수익률 */
  .rets { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .ret-chip {
    font-size: 0.72rem; border-radius: 6px; padding: 3px 8px;
    background: var(--bg); border: 1px solid var(--border);
  }
  .ret-chip b { font-weight: 700; }
  .hint { color: var(--muted); font-size: 0.78rem; margin-bottom: 12px; line-height: 1.5; }
  /* 차트 */
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  /* 뉴스 */
  .news-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .news-panel { height: 520px; overflow-y: auto; padding: 6px 0; scrollbar-width: thin; }
  .news-item {
    display: block;
    padding: 11px 16px;
    border-bottom: 1px solid var(--border);
    text-decoration: none;
    color: var(--text);
  }
  .news-item:hover { background: rgba(79,140,255,0.07); }
  .news-item .title { font-size: 0.88rem; line-height: 1.45; }
  .news-item .meta { font-size: 0.72rem; color: var(--muted); margin-top: 4px; }
  .loading { color: var(--muted); font-size: 0.85rem; padding: 18px; }
  /* ───── 종목 상세 모달 ───── */
  .detail-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.65);
    display: none; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .detail-overlay.open { display: block; }
  .detail-sheet {
    max-width: 860px; margin: 4vh auto 6vh;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .detail-head {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 18px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--card); z-index: 5;
  }
  .d-logo { width: 40px; height: 40px; border-radius: 50%; background: #fff; object-fit: contain; flex-shrink: 0; }
  .d-logo.hidden { display: none; }
  .d-title { min-width: 0; }
  .d-name { font-size: 1.1rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d-sub { font-size: 0.75rem; color: var(--muted); }
  .d-price-wrap { margin-left: auto; text-align: right; }
  .d-price { font-size: 1.15rem; font-weight: 700; }
  .d-chg { font-size: 0.8rem; }
  .d-close {
    background: none; border: none; color: var(--muted);
    font-size: 20px; cursor: pointer; padding: 6px; margin-left: 4px;
  }
  .d-close:hover { color: var(--text); }
  .detail-tabs {
    display: flex; border-bottom: 1px solid var(--border);
    position: sticky; top: 73px; background: var(--card); z-index: 5;
  }
  .detail-tabs button {
    flex: 1; background: none; border: none; color: var(--muted);
    padding: 12px 4px; font-size: 0.92rem; cursor: pointer;
    border-bottom: 2px solid transparent; font-weight: 600;
  }
  .detail-tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  .detail-body { padding: 18px; min-height: 300px; }
  .metric-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px; margin-bottom: 18px;
  }
  .metric {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px;
  }
  .metric .k { font-size: 0.72rem; color: var(--muted); }
  .metric .v { font-size: 0.98rem; font-weight: 700; margin-top: 3px; word-break: keep-all; }
  .band-wrap { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px 10px; }
  .band-title { font-size: 0.75rem; color: var(--muted); margin-bottom: 10px; }
  .band-bar { position: relative; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--down), #6a6f80, var(--up)); }
  .band-cursor {
    position: absolute; top: -4px; width: 4px; height: 16px;
    background: #fff; border-radius: 2px; transform: translateX(-50%);
  }
  .band-labels { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--muted); margin-top: 8px; }
  .fin-toggle { display: flex; gap: 6px; margin-bottom: 12px; }
  .fin-toggle button {
    background: var(--bg); border: 1px solid var(--border); color: var(--muted);
    border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: 0.82rem;
  }
  .fin-toggle button.active { border-color: var(--accent); color: var(--accent); }
  .fin-chart { width: 100%; height: 220px; display: block; margin-bottom: 6px; }
  .fin-legend { display: flex; gap: 14px; font-size: 0.75rem; color: var(--muted); margin-bottom: 14px; flex-wrap: wrap; }
  .fin-legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
  .fin-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
  .fin-table { border-collapse: collapse; width: 100%; font-size: 0.8rem; min-width: 460px; }
  .fin-table th, .fin-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
  .fin-table th:first-child, .fin-table td:first-child {
    text-align: left; position: sticky; left: 0; background: var(--card); color: var(--muted);
  }
  .fin-table thead th { color: var(--muted); font-weight: 600; background: var(--bg); }
  .fin-table tr:last-child td { border-bottom: none; }
  .unit-note { font-size: 0.7rem; color: var(--muted); margin: 8px 2px 0; }
  .fit-top { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .gauge { position: relative; width: 130px; height: 130px; flex-shrink: 0; }
  .gauge svg { transform: rotate(-90deg); }
  .gauge .score { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .gauge .score b { font-size: 1.6rem; }
  .gauge .score span { font-size: 0.68rem; color: var(--muted); }
  .fit-summary { flex: 1; min-width: 200px; }
  .fit-grade { font-size: 1.05rem; font-weight: 700; margin-bottom: 6px; }
  .fit-desc { font-size: 0.82rem; color: var(--muted); line-height: 1.6; }
  .target-box { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 13px 16px; margin-bottom: 16px; font-size: 0.85rem; }
  .check-list { display: flex; flex-direction: column; gap: 8px; }
  .check-item {
    display: flex; gap: 11px; align-items: flex-start;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 11px 14px;
  }
  .check-icon { font-size: 0.95rem; line-height: 1.4; }
  .check-item .t { font-size: 0.86rem; font-weight: 600; }
  .check-item .d { font-size: 0.76rem; color: var(--muted); margin-top: 2px; line-height: 1.5; }
  .good { color: #2ecc71; } .mid { color: #f1c40f; } .bad { color: #e74c3c; }
  .disclaimer {
    margin-top: 16px; padding: 11px 14px; border-radius: 10px;
    background: rgba(241,196,15,0.07); border: 1px solid rgba(241,196,15,0.25);
    font-size: 0.73rem; color: var(--muted); line-height: 1.6;
  }
  /* 기술 분석 탭 */
  .tech-chart-box { height: 380px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; }
  .tech-range { display: flex; gap: 4px; margin-bottom: 10px; }
  .tech-range button {
    background: var(--bg); border: 1px solid var(--border); color: var(--muted);
    border-radius: 6px; padding: 4px 12px; cursor: pointer; font-size: 0.78rem;
  }
  .tech-range button.active { border-color: var(--accent); color: var(--accent); }
  .ma-legend { display: flex; gap: 12px; font-size: 0.72rem; color: var(--muted); margin-bottom: 16px; flex-wrap: wrap; }
  .signal-summary {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 18px; margin-bottom: 14px;
  }
  .signal-verdict { font-size: 1.05rem; font-weight: 700; }
  .signal-counts { display: flex; gap: 10px; font-size: 0.8rem; color: var(--muted); }
  .signal-counts b { font-size: 0.92rem; }
  .sig-badge {
    font-size: 0.72rem; font-weight: 700; border-radius: 6px; padding: 3px 9px; white-space: nowrap;
  }
  .sig-badge.buy { background: rgba(46,204,113,0.15); color: #2ecc71; }
  .sig-badge.neutral { background: rgba(241,196,15,0.13); color: #f1c40f; }
  .sig-badge.sell { background: rgba(231,76,60,0.15); color: #e74c3c; }
  .check-item .head-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .fund-divider { margin: 22px 0 12px; font-size: 0.9rem; font-weight: 700; color: var(--muted); border-top: 1px solid var(--border); padding-top: 18px; }
  .d-loading { color: var(--muted); padding: 40px 0; text-align: center; line-height: 1.7; }
  .retry-btn {
    background: var(--accent); border: none; color: #fff;
    border-radius: 8px; padding: 8px 22px; cursor: pointer; font-size: 0.88rem; font-weight: 600;
  }
  @media (max-width: 800px) {
    .news-grid { grid-template-columns: 1fr; }
    .news-panel { height: 400px; }
    .tech-chart-box { height: 300px; }
    .section { padding: 0 12px; }
    header { padding: 12px 12px 4px; }
    .macro-strip { padding: 10px 12px 2px; }
    .detail-sheet { margin: 0; min-height: 100vh; border-radius: 0; border: none; }
    .detail-body { padding: 14px 12px; }
    .detail-tabs { top: 72px; }
  }
</style>
</head>
<body>

<header>
  <h1>📈 나의 주식 대시보드</h1>
  <span class="date" id="today"></span>
  <button class="refresh" id="refresh-btn">🔄 새로고침 <span id="updated-at"></span></button>
</header>

<!-- ① 거시 지표 -->
<div class="macro-strip" id="macro-strip"></div>

<!-- 보유 포트폴리오 요약 (보유 정보 입력 시 표시) -->
<div class="section" id="portfolio-section" hidden>
  <div class="pf-bar" id="portfolio-bar"></div>
</div>

<!-- ② 관심종목 -->
<div class="section">
  <div class="wl-head">
    <h2>⭐ 관심종목</h2>
    <select id="wl-sort" title="정렬">
      <option value="added">추가순</option>
      <option value="chg">등락률순</option>
      <option value="ret1m">1개월 수익률순</option>
      <option value="pl">보유 수익률순</option>
      <option value="name">이름순</option>
    </select>
    <button id="share-btn" title="관심종목 목록을 링크로 복사 — 폰 등 다른 기기에서 열면 그대로 가져옵니다">📤 목록 공유</button>
  </div>
  <div class="add-bar">
    <div class="ac-wrap">
      <input id="symbol-input" type="text" placeholder="종목 이름이나 코드로 검색 — 예: 삼성전자, 카카오, NVDA, 테슬라" autocomplete="off" />
      <div class="ac-results" id="ac-results" hidden></div>
    </div>
  </div>
  <div class="hint">
    한글 이름이나 티커로 검색해서 목록에서 선택하면 추가됩니다 (국내·미국 지원).
    카드를 클릭하면 시세·재무 분석·기술적 매매신호·뉴스가 있는 상세 화면이 열립니다.
  </div>
  <div class="cards" id="watchlist"></div>
</div>

<!-- ③ 뉴스 -->
<div class="section">
  <h2>📰 뉴스</h2>
  <div class="news-grid">
    <div>
      <h2 style="font-size:0.85rem;">시장 전체 (거시)</h2>
      <div class="panel news-panel" id="market-news"><div class="loading">불러오는 중…</div></div>
    </div>
    <div>
      <h2 style="font-size:0.85rem;">선택 종목 — <span id="news-symbol-label"></span></h2>
      <div class="panel news-panel" id="symbol-news"><div class="loading">불러오는 중…</div></div>
    </div>
  </div>
</div>

<!-- 종목 상세 모달 -->
<div class="detail-overlay" id="detail-overlay">
  <div class="detail-sheet">
    <div class="detail-head">
      <img class="d-logo hidden" id="d-logo" alt="">
      <div class="d-title">
        <div class="d-name" id="d-name"></div>
        <div class="d-sub" id="d-sub"></div>
      </div>
      <div class="d-price-wrap">
        <div class="d-price" id="d-price"></div>
        <div class="d-chg" id="d-chg"></div>
      </div>
      <button class="d-close" id="d-close" title="닫기">✕</button>
    </div>
    <div class="detail-tabs" id="detail-tabs">
      <button data-tab="overview" class="active">개요</button>
      <button data-tab="fund">재무 분석</button>
      <button data-tab="tech">기술 분석</button>
      <button data-tab="news">뉴스</button>
    </div>
    <div class="detail-body">
      <div class="d-tab" id="tab-overview"></div>
      <div class="d-tab" id="tab-fund" hidden></div>
      <div class="d-tab" id="tab-tech" hidden></div>
      <div class="d-tab" id="tab-news" hidden></div>
    </div>
  </div>
</div>

<script>
// 구형 모바일 브라우저 호환 (iOS 15·구형 안드로이드는 AbortSignal.timeout 미지원)
if (!AbortSignal.timeout) {
  AbortSignal.timeout = ms => {
    const c = new AbortController();
    setTimeout(() => c.abort(new DOMException('timeout', 'TimeoutError')), ms);
    return c.signal;
  };
}
// HTML 이스케이프 (종목명 등 외부 데이터 표시용)
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
// 만료된 시세/재무 캐시 정리 (localStorage 무한 증식 방지)
(() => {
  const now = Date.now(), DAY = 24 * 60 * 60 * 1000;
  for (let i = localStorage.length - 1; i >= 0; i--) {
    const k = localStorage.key(i);
    if (!/^(yf:|yfs:|nv:)/.test(k)) continue;
    try {
      const c = JSON.parse(localStorage.getItem(k));
      if (!c || !c.t || now - c.t > DAY) localStorage.removeItem(k);
    } catch (e) { localStorage.removeItem(k); }
  }
})();

// ───────────────────────── 설정 ─────────────────────────
const STORAGE_KEY = 'my-watchlist-v2';
const DEFAULT_LIST = [
  { symbol: '005930.KS', name: '삼성전자' },
  { symbol: '000660.KS', name: 'SK하이닉스' },
  { symbol: 'NVDA',      name: '엔비디아', reuters: 'NVDA.O' }
];
const MACRO = [
  { symbol: '^KS11',   label: '코스피',      fmt: 'num' },
  { symbol: '^KQ11',   label: '코스닥',      fmt: 'num' },
  { symbol: '^GSPC',   label: 'S&P 500',     fmt: 'num' },
  { symbol: '^IXIC',   label: '나스닥',      fmt: 'num' },
  { symbol: '^DJI',    label: '다우존스',    fmt: 'num' },
  { symbol: 'KRW=X',   label: '원/달러',     fmt: 'krw' },
  { symbol: '^TNX',    label: '미국채 10년', fmt: 'pct' },
  { symbol: 'CL=F',    label: 'WTI 유가',    fmt: 'usd' },
  { symbol: 'GC=F',    label: '금',          fmt: 'usd' },
  { symbol: 'BTC-USD', label: '비트코인',    fmt: 'usd' },
  { symbol: '^VIX',    label: 'VIX',         fmt: 'num' }
];
let usdkrw = null; // 원/달러 환율 — 미국 보유종목 원화 환산용
// CORS 프록시 폴백 체인 (정적 페이지에서 외부 API 호출용)
// corsproxy: 빠르지만 네이버 차단 / allorigins: 전체 지원, 가끔 과부하
// corsfix·jina: 네이버 포함 전체 지원 / codetabs: 최후 보루
const PROXY_DEFS = [
  { wrap: u => 'https://corsproxy.io/?url=' + encodeURIComponent(u) },
  { wrap: u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u) },
  { wrap: u => 'https://proxy.corsfix.com/?' + u },
  { wrap: u => 'https://r.jina.ai/' + u, headers: { 'X-Return-Format': 'text' } },
  { wrap: u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u) }
];
// 호스트별 마지막 성공 프록시 기억 (네이버는 corsproxy가 차단하므로 corsfix(2)부터 시작)
const proxyAffinity = { 'm.stock.naver.com': 2, 'api.stock.naver.com': 2, 'ac.stock.naver.com': 2 };
const CACHE_TTL = 3 * 60 * 1000; // 시세 캐시 3분

let watchlist = loadList();
let selected = watchlist[0] || DEFAULT_LIST[0];
const quoteCache = {}; // 카드 시세 저장 → 상세 모달 헤더에서 재사용

// ───────────────────────── 유틸 ─────────────────────────
function loadList() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (Array.isArray(saved) && saved.length && saved[0].symbol) return saved;
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT_LIST));
}
function saveList() { localStorage.setItem(STORAGE_KEY, JSON.stringify(watchlist)); }

async function fetchViaProxy(url, asText) {
  const host = new URL(url).host;
  const fav = proxyAffinity[host];
  const order = [...PROXY_DEFS.keys()];
  if (fav != null) order.splice(0, 0, ...order.splice(order.indexOf(fav), 1)); // 성공했던 프록시 우선
  let lastErr;
  for (const idx of order) {
    const p = PROXY_DEFS[idx];
    try {
      const res = await fetch(p.wrap(url), { headers: p.headers || {}, signal: AbortSignal.timeout(10000) });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      const out = asText ? text : JSON.parse(text); // 프록시가 에러 페이지를 200으로 줘도 JSON 검증에서 걸러짐
      proxyAffinity[host] = idx;
      return out;
    } catch (e) { lastErr = e; }
  }
  throw lastErr;
}

// Yahoo Finance 차트 API (시세 + 시계열, 인증 불필요)
async function fetchChart(symbol, range, interval, noCache) {
  const cacheKey = `yf:${symbol}:${range}:${interval}`;
  if (!noCache) {
    try {
      const c = JSON.parse(localStorage.getItem(cacheKey));
      if (c && Date.now() - c.t < CACHE_TTL) return c.d;
    } catch (e) {}
  }
  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?range=${range}&interval=${interval}`;
  const json = await fetchViaProxy(url, false);
  const result = json?.chart?.result?.[0];
  if (!result) throw new Error('no data: ' + symbol);
  try { localStorage.setItem(cacheKey, JSON.stringify({ t: Date.now(), d: result })); } catch (e) {}
  return result;
}

// Yahoo spark API — 여러 종목 시세를 한 번에 (프록시 요청 폭주 방지)
// 응답: { "심볼": { timestamp[], close[], previousClose, ... }, ... }
async function fetchSpark(symbols, range, interval, noCache) {
  const cacheKey = `yfs:${symbols.join('|')}:${range}`;
  if (!noCache) {
    try {
      const c = JSON.parse(localStorage.getItem(cacheKey));
      if (c && Date.now() - c.t < CACHE_TTL) return c.d;
    } catch (e) {}
  }
  // 심볼의 ^, = 등은 인코딩하되 구분자 콤마는 그대로 둬야 한다
  const symParam = symbols.map(encodeURIComponent).join(',');
  const url = `https://query1.finance.yahoo.com/v8/finance/spark?symbols=${symParam}&range=${range}&interval=${interval}`;
  const json = await fetchViaProxy(url, false);
  if (!json || typeof json !== 'object') throw new Error('spark: no data');
  try { localStorage.setItem(cacheKey, JSON.stringify({ t: Date.now(), d: json })); } catch (e) {}
  return json;
}

function isKorean(symbol) { return /\.(KS|KQ)$/.test(symbol); }

function lastValid(arr) {
  for (let i = (arr || []).length - 1; i >= 0; i--) if (arr[i] != null) return arr[i];
  return null;
}

function fmtPrice(v, symbol, fmt) {
  if (v == null) return '—';
  if (fmt === 'pct') return v.toFixed(2) + '%';
  if (fmt === 'krw' || isKorean(symbol)) return '₩' + Math.round(v).toLocaleString('ko-KR');
  if (fmt === 'usd' || (!fmt && !isKorean(symbol))) return '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return v.toLocaleString('ko-KR', { maximumFractionDigits: 2 });
}

function chgInfo(price, prevClose) {
  if (price == null || !prevClose) return { cls: 'flat', text: '—' };
  const diff = price - prevClose;
  const pct = (diff / prevClose) * 100;
  const cls = diff > 0 ? 'up' : diff < 0 ? 'down' : 'flat';
  const sign = diff > 0 ? '▲' : diff < 0 ? '▼' : '';
  return { cls, text: `${sign} ${Math.abs(diff).toLocaleString('en-US', { maximumFractionDigits: 2 })} (${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%)` };
}

function relTime(d) {
  const m = Math.floor((Date.now() - d.getTime()) / 60000);
  if (m < 1) return '방금';
  if (m < 60) return m + '분 전';
  const h = Math.floor(m / 60);
  if (h < 24) return h + '시간 전';
  return Math.floor(h / 24) + '일 전';
}

// ───────────────────────── ① 거시 지표 ─────────────────────────
async function renderMacro(noCache) {
  const strip = document.getElementById('macro-strip');
  if (!strip.children.length) {
    MACRO.forEach(m => {
      const chip = document.createElement('div');
      chip.className = 'macro-chip';
      chip.id = 'macro-' + m.symbol.replace(/[^A-Za-z0-9]/g, '');
      chip.innerHTML = `<div class="label">${m.label}</div><div class="price">…</div><div class="chg flat">—</div>`;
      strip.appendChild(chip);
    });
  }
  try {
    const data = await fetchSpark(MACRO.map(m => m.symbol), '1d', '15m', noCache);
    MACRO.forEach(m => {
      const chip = document.getElementById('macro-' + m.symbol.replace(/[^A-Za-z0-9]/g, ''));
      const d = data[m.symbol];
      if (!d) { chip.querySelector('.price').textContent = '—'; return; }
      const price = lastValid(d.close);
      if (m.symbol === 'KRW=X' && price) { usdkrw = price; updatePortfolio(); }
      const c = chgInfo(price, d.previousClose);
      chip.querySelector('.price').textContent = m.fmt === 'pct' ? price.toFixed(2) + '%' : fmtPrice(price, m.symbol, m.fmt);
      const chg = chip.querySelector('.chg');
      chg.className = 'chg ' + c.cls;
      chg.textContent = c.text;
    });
  } catch (e) {
    document.querySelectorAll('.macro-chip .price').forEach(p => { if (p.textContent === '…') p.textContent = '오류'; });
  }
}

// ───────────────────────── ② 관심종목 카드 ─────────────────────────
function renderWatchlist(noCache) {
  const grid = document.getElementById('watchlist');
  grid.innerHTML = '';
  if (!watchlist.length) {
    grid.innerHTML = '<div class="hint" style="padding:18px 4px">관심종목이 없습니다. 위 검색창에서 종목 이름을 검색해 추가해 보세요.</div>';
    updatePortfolio();
    return;
  }
  watchlist.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card' + (item.symbol === selected.symbol ? ' selected' : '');
    card.innerHTML = `
      <button class="del" title="삭제">✕</button>
      <div class="name">${esc(item.name || item.symbol)}</div>
      <div class="sym">${esc(item.symbol)}</div>
      <div class="price">…</div>
      <div class="chg flat">—</div>
      <div class="rets"></div>
      <div class="holding-line" hidden></div>
      <canvas></canvas>`;
    card.querySelector('.del').onclick = e => {
      e.stopPropagation();
      if (!confirm(`'${item.name || item.symbol}' 종목을 삭제할까요?`)) return;
      watchlist = watchlist.filter(w => w.symbol !== item.symbol);
      saveList();
      if (selected.symbol === item.symbol && watchlist.length) selectStock(watchlist[0]);
      renderWatchlist();
    };
    card.onclick = () => { selectStock(item); openDetail(item); };
    card.dataset.symbol = item.symbol;
    grid.appendChild(card);
  });
  fillCards(noCache);
}

// 모든 카드를 spark 1회 호출로 채운다
async function fillCards(noCache) {
  if (!watchlist.length) return;
  let data = null;
  try {
    data = await fetchSpark(watchlist.map(w => w.symbol), '3mo', '1d', noCache);
  } catch (e) {}
  watchlist.forEach(item => {
    const card = document.querySelector(`.card[data-symbol="${CSS.escape(item.symbol)}"]`);
    if (!card) return;
    const d = data && data[item.symbol];
    const closes = d ? (d.close || []).filter(v => v != null) : [];
    if (!closes.length) {
      card.querySelector('.price').textContent = '—';
      const chg = card.querySelector('.chg');
      chg.className = 'err';
      chg.textContent = '데이터를 불러오지 못했습니다';
      return;
    }
    const price = closes[closes.length - 1];
    const prev = closes.length > 1 ? closes[closes.length - 2] : null; // 전일 종가
    // 기간별 수익률: 1주(5거래일) · 1개월(21거래일) · 3개월(전체)
    const retOf = n => {
      const base = closes[closes.length - 1 - n];
      return base ? (price - base) / base * 100 : null;
    };
    const ret1m = retOf(21);
    quoteCache[item.symbol] = { price, prev, ret1m };
    const c = chgInfo(price, prev);
    card.querySelector('.price').textContent = fmtPrice(price, item.symbol);
    const chg = card.querySelector('.chg');
    chg.className = 'chg ' + c.cls;
    chg.textContent = '어제 대비 ' + c.text;
    const periods = [['1주', retOf(5)], ['1개월', ret1m], ['3개월', closes.length > 1 ? (price - closes[0]) / closes[0] * 100 : null]];
    card.querySelector('.rets').innerHTML = periods
      .filter(p => p[1] != null)
      .map(p => {
        const cls = p[1] > 0 ? 'up' : p[1] < 0 ? 'down' : 'flat';
        return `<span class="ret-chip">${p[0]} <b class="${cls}">${p[1] >= 0 ? '+' : ''}${p[1].toFixed(1)}%</b></span>`;
      }).join('');
    fillHoldingLine(card, item);
    if (!item.name) fillName(item, card); // 이름이 없으면 비동기로 종목명 조회
    // 스파크라인 색은 3개월 추세 기준
    const trend = closes[closes.length - 1] > closes[0] ? 'up'
      : closes[closes.length - 1] < closes[0] ? 'down' : 'flat';
    drawSparkline(card.querySelector('canvas'), closes, trend);
  });
  sortCards();
  updatePortfolio();
}

// ── 보유 손익 (수량·평단가는 상세 화면 개요 탭에서 입력) ──
function holdingPL(item) {
  const q = quoteCache[item.symbol];
  if (!item.qty || !item.avg || !q || !q.price) return null;
  const cost = item.qty * item.avg;
  const value = item.qty * q.price;
  return { cost, value, diff: value - cost, pct: (value - cost) / cost * 100 };
}

function fillHoldingLine(card, item) {
  const line = card.querySelector('.holding-line');
  const pl = holdingPL(item);
  if (!pl) { line.hidden = true; return; }
  const cls = pl.diff > 0 ? 'up' : pl.diff < 0 ? 'down' : 'flat';
  line.hidden = false;
  line.innerHTML = `💼 ${item.qty.toLocaleString()}주 보유 · 손익 <b class="${cls}">${pl.diff >= 0 ? '+' : ''}${fmtPrice(Math.abs(pl.diff), item.symbol).replace(/^([₩$])/, pl.diff < 0 ? '-$1' : '$1')} (${pl.pct >= 0 ? '+' : ''}${pl.pct.toFixed(1)}%)</b>`;
}

// ── 포트폴리오 총 요약 (미국 종목은 원/달러 환율로 환산) ──
function updatePortfolio() {
  const section = document.getElementById('portfolio-section');
  const bar = document.getElementById('portfolio-bar');
  const holdings = watchlist.filter(w => w.qty && w.avg && quoteCache[w.symbol] && quoteCache[w.symbol].price);
  if (!holdings.length) { section.hidden = true; return; }
  const needFx = holdings.some(w => !isKorean(w.symbol));
  if (needFx && !usdkrw) { section.hidden = true; return; } // 환율 로드 후 다시 호출됨
  let cost = 0, value = 0;
  holdings.forEach(w => {
    const pl = holdingPL(w);
    const fx = isKorean(w.symbol) ? 1 : usdkrw;
    cost += pl.cost * fx;
    value += pl.value * fx;
  });
  const diff = value - cost, pct = cost ? diff / cost * 100 : 0;
  const cls = diff > 0 ? 'up' : diff < 0 ? 'down' : 'flat';
  const won = v => '₩' + Math.round(Math.abs(v)).toLocaleString('ko-KR');
  section.hidden = false;
  bar.innerHTML = `
    <div class="pf-item"><div class="k">💼 보유 평가금액</div><div class="v">${won(value)}</div></div>
    <div class="pf-item"><div class="k">매입금액</div><div class="v">${won(cost)}</div></div>
    <div class="pf-item"><div class="k">평가손익</div><div class="v ${cls}">${diff >= 0 ? '+' : '-'}${won(diff)} (${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%)</div></div>
    <div class="pf-item"><div class="k">환율 적용</div><div class="v" style="font-size:0.85rem;color:var(--muted)">${needFx && usdkrw ? '$1 = ₩' + Math.round(usdkrw).toLocaleString() : '원화 종목만'}</div></div>`;
}

// ── 카드 정렬 ──
const sortSel = document.getElementById('wl-sort');
sortSel.value = localStorage.getItem('wl-sort') || 'added';
sortSel.onchange = () => { localStorage.setItem('wl-sort', sortSel.value); sortCards(); };

function sortCards() {
  const mode = sortSel.value;
  if (mode === 'added') return; // 저장된 순서 그대로
  const grid = document.getElementById('watchlist');
  const cards = [...grid.querySelectorAll('.card')];
  const keyOf = sym => {
    const item = watchlist.find(w => w.symbol === sym);
    const q = quoteCache[sym] || {};
    if (mode === 'chg') return q.price && q.prev ? (q.price - q.prev) / q.prev : -Infinity;
    if (mode === 'ret1m') return q.ret1m != null ? q.ret1m : -Infinity;
    if (mode === 'pl') { const pl = item && holdingPL(item); return pl ? pl.pct : -Infinity; }
    return 0;
  };
  cards.sort((a, b) => {
    if (mode === 'name') {
      const an = (watchlist.find(w => w.symbol === a.dataset.symbol) || {}).name || a.dataset.symbol;
      const bn = (watchlist.find(w => w.symbol === b.dataset.symbol) || {}).name || b.dataset.symbol;
      return an.localeCompare(bn, 'ko');
    }
    return keyOf(b.dataset.symbol) - keyOf(a.dataset.symbol); // 내림차순
  });
  cards.forEach(c => grid.appendChild(c));
}

// ── 관심종목 공유 링크 (기기 간 이동: localStorage가 브라우저별이라 링크로 전달) ──
document.getElementById('share-btn').onclick = async () => {
  const payload = watchlist.map(w => ({ symbol: w.symbol, name: w.name, reuters: w.reuters }));
  const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
  const url = location.origin + location.pathname + '#wl=' + b64;
  try {
    await navigator.clipboard.writeText(url);
    alert('관심종목 목록 링크가 복사되었습니다.\n폰 등 다른 기기의 브라우저에 붙여넣어 열면 목록을 그대로 가져옵니다.');
  } catch (e) {
    prompt('아래 링크를 복사해 다른 기기에서 여세요:', url);
  }
};

// 공유 링크로 접속한 경우 목록 가져오기
(() => {
  const m = location.hash.match(/^#wl=(.+)$/);
  if (!m) return;
  try {
    const imported = JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    if (Array.isArray(imported) && imported.length && imported[0].symbol) {
      if (confirm(`공유받은 관심종목 ${imported.length}개를 가져올까요?\n(현재 목록은 대체되며, 보유 정보는 유지되지 않습니다)`)) {
        watchlist = imported;
        saveList();
        selected = watchlist[0];
      }
    }
  } catch (e) {}
  history.replaceState(null, '', location.pathname + location.search);
})();

async function fillName(item, card) {
  try {
    const r = await fetchChart(item.symbol, '1d', '15m');
    item.name = r.meta.shortName || r.meta.longName || item.symbol;
    card.querySelector('.name').textContent = item.name;
    saveList();
    if (selected.symbol === item.symbol) renderSymbolNews();
  } catch (e) {}
}

function drawSparkline(canvas, data, cls) {
  if (!data.length) return;
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const min = Math.min(...data), max = Math.max(...data), span = max - min || 1;
  const color = cls === 'up' ? '#f04452' : cls === 'down' ? '#3182f6' : '#8a90a3';
  ctx.beginPath();
  data.forEach((v, i) => {
    const x = (i / (data.length - 1)) * w;
    const y = h - 4 - ((v - min) / span) * (h - 8);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.6;
  ctx.stroke();
  ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath();
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, color + '33');
  grad.addColorStop(1, color + '00');
  ctx.fillStyle = grad;
  ctx.fill();
}

// ───────────────────────── ③ 뉴스 (구글뉴스 RSS) ─────────────────────────
async function renderNews(el, rssUrl, attempt) {
  el.innerHTML = '<div class="loading">불러오는 중…</div>';
  try {
    const xml = await fetchViaProxy(rssUrl, true);
    const doc = new DOMParser().parseFromString(xml, 'text/xml');
    const items = [...doc.querySelectorAll('item')].slice(0, 25);
    if (!items.length) throw new Error('empty');
    el.innerHTML = '';
    items.forEach(it => {
      const title = it.querySelector('title')?.textContent || '';
      const link = it.querySelector('link')?.textContent || '#';
      const pub = new Date(it.querySelector('pubDate')?.textContent || Date.now());
      const source = it.querySelector('source')?.textContent || '';
      const a = document.createElement('a');
      a.className = 'news-item';
      a.href = link;
      a.target = '_blank';
      a.rel = 'noopener';
      a.innerHTML = `<div class="title"></div><div class="meta"></div>`;
      a.querySelector('.title').textContent = title;
      a.querySelector('.meta').textContent = `${source} · ${relTime(pub)}`;
      el.appendChild(a);
    });
  } catch (e) {
    if (!attempt) {
      // 일시적 프록시 차단(요청 폭주) 대비 한 번 재시도
      el.innerHTML = '<div class="loading">잠시 후 다시 시도합니다…</div>';
      setTimeout(() => renderNews(el, rssUrl, 1), 3000);
    } else {
      el.innerHTML = '<div class="loading">뉴스를 불러오지 못했습니다. 새로고침해 보세요.</div>';
    }
  }
}

function gnewsSearch(q) {

  const seq = ++acSeq;
  acBox.hidden = false;

  try {
    const url = 'https://ac.stock.naver.com/ac?q=' + encodeURIComponent(q) + '&target=stock';

    const items = (j.items || []).filter(it => it.category === 'stock' && (it.nationCode === 'KOR' || it.nationCode === 'USA')).slice(0, 8);
    if (!items.length) {
      acBox.innerHTML = '<div class="ac-empty">검색 결과가 없습니다 (국내·미국 종목만 지원)</div>';

function addFromSearch(it) {
  let symbol, reuters;
  if (it.nationCode === 'KOR') {
    symbol = it.code + (it.typeCode === 'KOSDAQ' ? '.KQ' : '.KS');
    reuters = it.reutersCode || it.code;
  } else {

  renderWatchlist();

// ═════════════════════ 종목 상세 모달 ═════════════════════
// 데이터: 네이버 증권 비공개 API (국내 m.stock.naver.com, 해외 api.stock.naver.com)
const NV_TTL = 6 * 60 * 60 * 1000; // 재무 데이터 캐시 6시간 (프록시 부하 최소화)

async function fetchNaver(url) {
  const key = 'nv:' + url;
  try {
    const c = JSON.parse(localStorage.getItem(key));
    if (c && Date.now() - c.t < NV_TTL) return c.d;
  } catch (e) {}
  const j = await fetchViaProxy(url, false);
  try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), d: j })); } catch (e) {}
  return j;
}

// 미국 티커 → 네이버 로이터 코드 (.O 나스닥 / .N NYSE / .A AMEX)
async function resolveReuters(ticker) {
  const map = JSON.parse(localStorage.getItem('reutersMap') || '{}');
  if (map[ticker]) return map[ticker];
  for (const suf of ['.O', '.N', '.A']) {
    try {
      const b = await fetchNaver('https://api.stock.naver.com/stock/' + ticker + suf + '/basic');
      if (b && b.reutersCode) {
        map[ticker] = b.reutersCode;
        localStorage.setItem('reutersMap', JSON.stringify(map));
        return b.reutersCode;
      }
    } catch (e) {}
  }
  throw new Error('종목 코드를 찾을 수 없습니다: ' + ticker);
}

async function loadDetailData(item) {
  if (isKorean(item.symbol)) {
    const code = item.symbol.split('.')[0];
    const base = 'https://m.stock.naver.com/api/stock/' + code;
    const [basic, integ, annual] = await Promise.all([
      fetchNaver(base + '/basic'),
      fetchNaver(base + '/integration'),
      fetchNaver(base + '/finance/annual')
    ]);
    let quarter = null;
    try { quarter = (await fetchNaver(base + '/finance/quarter')).financeInfo; } catch (e) {}
    return {
      kr: true, basic,
      infos: integ.totalInfos || [],
      consensus: integ.consensusInfo,
      annual: annual.financeInfo, quarter,
      unit: '억원 · %, 배 생략'
    };
  } else {
    const reuters = item.reuters || await resolveReuters(item.symbol);
    const base = 'https://api.stock.naver.com/stock/' + reuters;
    const [basic, integ, annual] = await Promise.all([
      fetchNaver(base + '/basic'),
      fetchNaver(base + '/integration'),
      fetchNaver(base + '/finance/annual')
    ]);
    let quarter = null;
    try { quarter = await fetchNaver(base + '/finance/quarter'); } catch (e) {}
    return {
      kr: false, basic,
      infos: basic.stockItemTotalInfos || [],
      consensus: integ.consensusInfo,
      annual, quarter,
      unit: annual.unit || 'USD(백만) · %, 배 생략'
    };
  }
}

// ── 파싱 헬퍼 ──
function infoVal(infos, key) {
  const f = infos.find(x => x.key === key);
  return f ? f.value : null;
}
function numOf(s) {
  if (s == null) return null;
  const n = parseFloat(String(s).replace(/[^\d.\-]/g, ''));
  return isNaN(n) ? null : n;
}
function finSeries(fin, title) {
  if (!fin || !fin.rowList) return [];
  const row = fin.rowList.find(r => r.title === title);
  if (!row) return [];
  return (fin.trTitleList || []).map(t => {
    const col = row.columns[t.key];
    return { label: t.title, est: t.isConsensus === 'Y', value: numOf(col && col.value) };
  });
}
// 컨센서스(추정치) 제외 마지막 실적값과 그 직전값
function lastActual(series) {
  const act = series.filter(s => !s.est && s.value != null);
  return { cur: act.length ? act[act.length - 1].value : null, prev: act.length > 1 ? act[act.length - 2].value : null };
}

    </div>`;
  }
  // 내 보유 정보 입력 (수량·평단가 → 카드와 상단 요약에 손익 표시)

      <button id="hf-save">저장</button>

    </div>
    <div class="hf-result" id="hf-result"></div>

  const showPL = () => {

    const box = el.querySelector('#hf-result');

    box.innerHTML = `평가금액 <b>${fmtPrice(pl.value, item.symbol)}</b> · 손익 <b class="${cls}">${pl.diff >= 0 ? '+' : ''}${fmtPrice(pl.diff, item.symbol)} (${pl.pct >= 0 ? '+' : ''}${pl.pct.toFixed(2)}%)</b>`;

function drawFinance(d) {
  const fin = finPeriod === 'quarter' && d.quarter ? d.quarter : d.annual;
  // 막대 차트: 매출액 + 이익 2종
  const serieDefs = d.kr
    ? [{ t: '매출액', c: '#4f8cff' }, { t: '영업이익', c: '#38c79a' }, { t: '당기순이익', c: '#b08cff' }]
    : [{ t: '매출액', c: '#4f8cff' }, { t: 'EBIT', c: '#38c79a' }, { t: '당기순이익', c: '#b08cff' }];
  const series = serieDefs.map(s => ({ ...s, data: finSeries(fin, s.t) })).filter(s => s.data.some(x => x.value != null));
  drawFinChart(document.getElementById('fin-chart'), series);
  document.getElementById('fin-legend').innerHTML = series.map(s =>
    `<span><span class="dot" style="background:${s.c}"></span>${s.t}</span>`).join('');
  // 전체 표
  let t = '<table class="fin-table"><thead><tr><th>항목</th>';
  (fin.trTitleList || []).forEach(c => { t += `<th>${c.title}${c.isConsensus === 'Y' ? ' (E)' : ''}</th>`; });
  t += '</tr></thead><tbody>';
  (fin.rowList || []).forEach(r => {
    t += `<tr><td>${r.title}</td>`;
    (fin.trTitleList || []).forEach(c => {
      const col = r.columns[c.key];
      t += `<td>${col && col.value != null ? col.value : '-'}</td>`;
    });
    t += '</tr>';
  });
  t += '</tbody></table>';
  document.getElementById('fin-table-wrap').innerHTML = t;
}

function drawFinChart(canvas, series) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  if (!series.length) return;
  const labels = series[0].data.map(x => x.label);
  const all = series.flatMap(s => s.data.map(x => x.value)).filter(v => v != null);
  if (!all.length) return;
  const maxV = Math.max(...all, 0), minV = Math.min(...all, 0);
  const span = (maxV - minV) || 1;
  const padT = 16, padB = 34, plotH = h - padT - padB;
  const y = v => padT + (maxV - v) / span * plotH;
  const groupW = w / labels.length;
  const barW = Math.min(22, (groupW - 24) / series.length);
  // 0 기준선
  ctx.strokeStyle = '#2a2e3a';
  ctx.beginPath(); ctx.moveTo(0, y(0)); ctx.lineTo(w, y(0)); ctx.stroke();
  labels.forEach((lab, i) => {
    const cx = groupW * i + groupW / 2;
    series.forEach((s, si) => {
      const v = s.data[i] ? s.data[i].value : null;
      if (v == null) return;
      const x = cx - (series.length * barW) / 2 + si * barW;
      ctx.fillStyle = s.c + (s.data[i].est ? '77' : '');
      const y0 = y(0), y1 = y(v);
      ctx.fillRect(x, Math.min(y0, y1), barW - 3, Math.max(2, Math.abs(y0 - y1)));
    });
    ctx.fillStyle = '#8a90a3';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    const est = series[0].data[i] && series[0].data[i].est;
    ctx.fillText(lab + (est ? '(E)' : ''), cx, h - 14);
  });
}

// ── ③ 투자적합도 탭 ──
function makeCheck(grade, title, desc) { return { grade, title, desc }; }
function band(v, goodCond, midCond) { return goodCond ? 'good' : midCond ? 'mid' : 'bad'; }

function buildChecks(d, item) {
  const checks = [];
  const cur = quoteCache[item.symbol] ? quoteCache[item.symbol].price : numOf(infoVal(d.infos, '전일'));
  // 1. 애널리스트 투자의견 (1~5, 높을수록 매수)
  const rec = d.consensus && numOf(d.consensus.recommMean);
  if (rec) {
    const txt = rec >= 4.5 ? '적극 매수' : rec >= 3.5 ? '매수' : rec >= 2.5 ? '중립' : rec >= 1.5 ? '매도' : '적극 매도';
    checks.push(makeCheck(band(rec, rec >= 3.5, rec >= 2.5), '애널리스트 투자의견: ' + txt,
      `증권사 컨센서스 평균 ${rec.toFixed(2)}점 / 5점 (3.5 이상이면 매수 우세)`));
  }
  // 2. 목표주가 대비 상승여력
  const target = d.consensus && numOf(d.consensus.priceTargetMean);
  if (target && cur) {
    const up = (target - cur) / cur * 100;
    checks.push(makeCheck(band(up, up >= 15, up >= 0),
      `목표주가 대비 ${up >= 0 ? '상승여력' : '하락위험'} ${Math.abs(up).toFixed(1)}%`,
      `애널리스트 평균 목표주가 ${fmtPrice(target, item.symbol)} vs 현재가 ${fmtPrice(cur, item.symbol)}. 현재가가 목표주가를 넘었다면 과열 신호일 수 있습니다.`));
  }
  // 3. PER
  const per = numOf(infoVal(d.infos, 'PER'));
  if (per) {
    checks.push(makeCheck(band(per, per > 0 && per < 15, per > 0 && per < 30), `PER ${per.toFixed(1)}배`,
      'PER(주가수익비율)이 낮을수록 이익 대비 주가가 저렴. 통상 15배 미만 저평가권, 30배 초과는 고평가권으로 봅니다 (업종별 차이 큼).'));
  }
  // 4. 추정PER 개선 (국내만 제공)
  const fper = numOf(infoVal(d.infos, '추정PER'));
  if (per && fper) {
    checks.push(makeCheck(band(fper, fper < per * 0.8, fper <= per), `추정 PER ${fper.toFixed(1)}배 (현재 ${per.toFixed(1)}배)`,
      '추정PER이 현재PER보다 낮으면 앞으로 이익이 늘어난다는 증권가 전망을 뜻합니다.'));
  }
  // 5. PBR
  const pbr = numOf(infoVal(d.infos, 'PBR'));
  if (pbr) {
    checks.push(makeCheck(band(pbr, pbr < 1.2, pbr < 3), `PBR ${pbr.toFixed(2)}배`,
      'PBR(주가순자산비율) 1배 미만이면 장부상 자산가치보다 싸게 거래된다는 의미입니다.'));
  }
  // 6. 수익성 (KR: ROE / US: ROA)
  const profKey = d.kr ? 'ROE' : 'ROA';
  const prof = lastActual(finSeries(d.annual, profKey)).cur;
  if (prof != null) {
    const th = d.kr ? [10, 5] : [7, 3];
    checks.push(makeCheck(band(prof, prof >= th[0], prof >= th[1]), `${profKey} ${prof.toFixed(1)}%`,
      d.kr ? 'ROE(자기자본이익률) 10% 이상이면 자본을 효율적으로 굴리는 기업으로 평가합니다.'
           : 'ROA(총자산이익률) 7% 이상이면 자산 효율이 높은 기업으로 평가합니다.'));
  }
  // 7. 매출 성장
  const rev = lastActual(finSeries(d.annual, '매출액'));
  if (rev.cur != null && rev.prev) {
    const g = (rev.cur - rev.prev) / Math.abs(rev.prev) * 100;
    checks.push(makeCheck(band(g, g >= 10, g >= 0), `매출 성장률 ${g >= 0 ? '+' : ''}${g.toFixed(1)}% (최근 결산 연도)`,
      '직전 연도 대비 매출 증가율. 10% 이상이면 뚜렷한 성장세입니다.'));
  }
  // 8. 이익 성장
  const profitTitle = d.kr ? '영업이익' : '당기순이익';
  const pr = lastActual(finSeries(d.annual, profitTitle));
  if (pr.cur != null && pr.prev) {
    const g = (pr.cur - pr.prev) / Math.abs(pr.prev) * 100;
    checks.push(makeCheck(band(g, g >= 10, g >= 0), `${profitTitle} 성장률 ${g >= 0 ? '+' : ''}${g.toFixed(1)}%`,
      '이익이 매출보다 빠르게 늘면 수익성이 개선되고 있다는 신호입니다.'));
  }
  // 9. 재무 안정성 (국내만 제공)
  const debt = lastActual(finSeries(d.annual, '부채비율')).cur;
  if (debt != null) {
    checks.push(makeCheck(band(debt, debt < 100, debt < 200), `부채비율 ${debt.toFixed(0)}%`,
      '부채비율 100% 미만이면 안정적, 200%를 넘으면 재무 부담이 큰 편입니다.'));
  }
  // 10. 52주 가격 위치
  const high = numOf(infoVal(d.infos, '52주 최고'));
  const low = numOf(infoVal(d.infos, '52주 최저'));
  if (high && low && cur && high > low) {
    const pos = (cur - low) / (high - low) * 100;
    checks.push(makeCheck(band(pos, pos < 40, pos < 80), `52주 범위의 ${pos.toFixed(0)}% 지점`,
      '1년 가격 범위에서 현재가의 위치. 고점 부근(80% 이상)이면 단기 과열 가능성을 함께 살펴보세요.'));
  }
  return checks;
}

function buildFitHTML(d, item) {
  const checks = buildChecks(d, item);
  if (!checks.length) return '<div class="d-loading">적합도를 계산할 데이터가 부족합니다.</div>';
  const score = Math.round(checks.reduce((a, c) => a + (c.grade === 'good' ? 2 : c.grade === 'mid' ? 1 : 0), 0) / (checks.length * 2) * 100);
  const gradeTxt = score >= 65 ? ['저평가·매력 신호 우세', 'good'] : score >= 45 ? ['중립 — 신호 혼재', 'mid'] : ['고평가·주의 신호 우세', 'bad'];
  const gcolor = { good: '#2ecc71', mid: '#f1c40f', bad: '#e74c3c' }[gradeTxt[1]];
  const R = 56, CIRC = 2 * Math.PI * R;
  let html = `<div class="fit-top">
    <div class="gauge">
      <svg width="130" height="130" viewBox="0 0 130 130">
        <circle cx="65" cy="65" r="${R}" fill="none" stroke="#2a2e3a" stroke-width="11"/>
        <circle cx="65" cy="65" r="${R}" fill="none" stroke="${gcolor}" stroke-width="11" stroke-linecap="round"
          stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC * (1 - score / 100)}"/>
      </svg>
      <div class="score"><b>${score}</b><span>/ 100점</span></div>
    </div>
    <div class="fit-summary">
      <div class="fit-grade ${gradeTxt[1]}">${gradeTxt[0]}</div>
      <div class="fit-desc">아래 ${checks.length}개 체크 항목을 종합한 점수입니다.
      녹색(✓)은 긍정, 노랑(△)은 중립, 빨강(✗)은 주의 신호입니다. 각 항목의 근거를 직접 확인해 보세요.</div>
    </div>
  </div>`;
  // 목표주가 박스
  const target = d.consensus && numOf(d.consensus.priceTargetMean);
  const cur = quoteCache[item.symbol] ? quoteCache[item.symbol].price : null;
  if (target && cur) {
    const up = (target - cur) / cur * 100;
    html += `<div class="target-box">🎯 애널리스트 평균 목표주가 <b>${fmtPrice(target, item.symbol)}</b>
      — 현재가 대비 <b class="${up >= 0 ? 'good' : 'bad'}">${up >= 0 ? '+' : ''}${up.toFixed(1)}%</b>`;
    if (d.consensus.priceTargetHigh) html += ` <span style="color:var(--muted)">(최고 ${fmtPrice(numOf(d.consensus.priceTargetHigh), item.symbol)} / 최저 ${fmtPrice(numOf(d.consensus.priceTargetLow), item.symbol)})</span>`;
    html += `</div>`;
  }
  const icon = { good: '✓', mid: '△', bad: '✗' };
  html += '<div class="check-list">' + checks.map(c =>
    `<div class="check-item"><span class="check-icon ${c.grade}">${icon[c.grade]}</span>
     <div><div class="t">${c.title}</div><div class="d">${c.desc}</div></div></div>`).join('') + '</div>';
  html += `<div class="disclaimer">⚠️ 본 적합도 점수는 네이버 증권 공개 데이터를 단순 규칙으로 평가한 <b>참고용 지표</b>이며 투자 권유가 아닙니다.
    PER·PBR 적정 수준은 업종마다 크게 다르고, 컨센서스는 변경될 수 있습니다. 투자 판단과 책임은 본인에게 있습니다.</div>`;
  return html;
}

// ── ③ 기술 분석 탭 ──
// 표준 기준: RSI(14) 30/70, MACD(12,26,9) 시그널 교차, 이동평균 5/20/60 크로스,
// 볼린저밴드(20,±2σ), Envelope(20일선 ±6%), 스토캐스틱(14,3) 20/80, 거래량 20일 평균 대비
let techState = null;

async function renderTechTab(item) {
  const el = document.getElementById('tab-tech');
  techState = null;
  el.innerHTML = '<div class="d-loading">차트와 기술 지표를 계산하는 중…</div>';
  try {
    const r = await fetchChart(item.symbol, '1y', '1d');
    if (detailItem !== item) return;
    const q = r.indicators.quote[0];
    const bars = (r.timestamp || []).map((t, i) => ({
      time: t, open: q.open[i], high: q.high[i], low: q.low[i], close: q.close[i], volume: (q.volume && q.volume[i]) || 0
    })).filter(b => b.close != null && b.open != null && b.high != null && b.low != null);
    if (bars.length < 30) throw new Error('데이터 부족');
    techState = { item, bars, range: '6mo' };
    buildTechUI(el);
  } catch (e) {
    if (detailItem !== item) return;
    el.innerHTML = '<div class="d-loading">차트 데이터를 불러오지 못했습니다.<br><br><button class="retry-btn">다시 시도</button></div>';
    el.querySelector('.retry-btn').onclick = () => renderTechTab(item);
  }
}

function buildTechUI(el) {
  const sigs = computeSignals(techState.bars);
  const buy = sigs.filter(s => s.grade === 'buy').length;
  const sell = sigs.filter(s => s.grade === 'sell').length;
  const neutral = sigs.length - buy - sell;
  const verdict = buy >= sell + 2 ? ['📈 매수 우세', 'good'] : sell >= buy + 2 ? ['📉 매도 우세', 'bad'] : ['⚖️ 중립 — 신호 혼재', 'mid'];
  const icon = { buy: '▲', neutral: '─', sell: '▼' };
  const iconCls = { buy: 'good', neutral: 'mid', sell: 'bad' };
  const badge = { buy: '매수 신호', neutral: '중립', sell: '매도 신호' };
  let html = `
    <div class="tech-range" id="tech-range">
      <button data-r="3mo">3개월</button>
      <button data-r="6mo" class="active">6개월</button>
      <button data-r="1y">1년</button>
    </div>
    <div class="tech-chart-box" id="tech-chart"></div>
    <div class="ma-legend">
      <span style="color:#f1c40f">━ 5일선</span>
      <span style="color:#4f8cff">━ 20일선</span>
      <span style="color:#b08cff">━ 60일선</span>
      <span>하단 막대: 거래량</span>
    </div>
    <div class="signal-summary">
      <div class="signal-verdict ${verdict[1]}">기술적 종합: ${verdict[0]}</div>
      <div class="signal-counts">
        <span class="good">매수 <b>${buy}</b></span>
        <span class="mid">중립 <b>${neutral}</b></span>
        <span class="bad">매도 <b>${sell}</b></span>
      </div>
    </div>
    <div class="check-list">` + sigs.map(s => `
      <div class="check-item">
        <span class="check-icon ${iconCls[s.grade]}">${icon[s.grade]}</span>
        <div style="flex:1">
          <div class="head-row"><span class="t">${s.title}</span><span class="sig-badge ${s.grade}">${badge[s.grade]}</span></div>
          <div class="d">${s.desc}</div>
        </div>
      </div>`).join('') + `</div>
    <div class="disclaimer">⚠️ 기술적 지표는 과거 가격·거래량의 통계일 뿐 미래 수익을 보장하지 않습니다.
      RSI 30/70, MACD 시그널 교차, 골든크로스, 볼린저밴드 ±2σ 등 일반적으로 통용되는 표준 기준을 적용했습니다.
      단일 신호보다 여러 신호의 방향과 재무 분석을 함께 보세요. 투자 판단과 책임은 본인에게 있습니다.</div>`;
  el.innerHTML = html;
  el.querySelector('#tech-range').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    techState.range = b.dataset.r;
    el.querySelectorAll('#tech-range button').forEach(x => x.classList.toggle('active', x === b));
    drawTechChart();
  });
  drawTechChart();
}

function drawTechChart() {
  if (!techState) return;
  const box = document.getElementById('tech-chart');
  if (!box || !box.offsetParent) return; // 탭이 숨겨진 상태면 보일 때 다시 그림
  box.innerHTML = '';
  const { bars, item, range } = techState;
  const n = range === '3mo' ? 63 : range === '6mo' ? 126 : bars.length;
  const start = Math.max(0, bars.length - n);
  const closes = bars.map(b => b.close);
  const maArr = p => closes.map((_, i) => i + 1 >= p ? closes.slice(i + 1 - p, i + 1).reduce((a, b) => a + b, 0) / p : null);
  const chart = LightweightCharts.createChart(box, {
    autoSize: true,
    layout: { background: { color: 'transparent' }, textColor: '#8a90a3' },
    grid: { vertLines: { color: '#1f2330' }, horzLines: { color: '#1f2330' } },
    timeScale: { borderColor: '#2a2e3a' },
    rightPriceScale: { borderColor: '#2a2e3a' },
    localization: {
      priceFormatter: v => isKorean(item.symbol) ? Math.round(v).toLocaleString('ko-KR') : v.toFixed(2)
    }
  });
  const candle = chart.addCandlestickSeries({
    upColor: '#f04452', downColor: '#3182f6',
    wickUpColor: '#f04452', wickDownColor: '#3182f6',
    borderVisible: false
  });
  candle.setData(bars.slice(start).map(b => ({ time: b.time, open: b.open, high: b.high, low: b.low, close: b.close })));
  const vol = chart.addHistogramSeries({ priceScaleId: 'vol', priceFormat: { type: 'volume' }, lastValueVisible: false, priceLineVisible: false });
  chart.priceScale('vol').applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });
  vol.setData(bars.slice(start).map(b => ({
    time: b.time, value: b.volume,
    color: b.close >= b.open ? 'rgba(240,68,82,0.4)' : 'rgba(49,130,246,0.4)'
  })));
  [[maArr(5), '#f1c40f'], [maArr(20), '#4f8cff'], [maArr(60), '#b08cff']].forEach(([data, color]) => {
    const s = chart.addLineSeries({ color, lineWidth: 1.5, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
    s.setData(bars.map((b, i) => ({ time: b.time, value: data[i] })).slice(start).filter(p => p.value != null));
  });
  chart.timeScale().fitContent();
}

// ── 기술 지표 계산 ──
function rsiWilder(closes, period) {
  if (closes.length < period + 1) return null;
  let gain = 0, loss = 0;
  for (let i = 1; i <= period; i++) {
    const d = closes[i] - closes[i - 1];
    if (d >= 0) gain += d; else loss -= d;
  }
  gain /= period; loss /= period;
  for (let i = period + 1; i < closes.length; i++) {
    const d = closes[i] - closes[i - 1];
    gain = (gain * (period - 1) + Math.max(d, 0)) / period;
    loss = (loss * (period - 1) + Math.max(-d, 0)) / period;
  }
  return loss === 0 ? 100 : 100 - 100 / (1 + gain / loss);
}
function emaArr(arr, p) {
  const k = 2 / (p + 1);
  let e = arr[0];
  const out = [e];
  for (let i = 1; i < arr.length; i++) { e = arr[i] * k + e * (1 - k); out.push(e); }
  return out;
}
function macdCalc(closes) {
  const e12 = emaArr(closes, 12), e26 = emaArr(closes, 26);
  const macd = closes.map((_, i) => e12[i] - e26[i]);
  const sig = emaArr(macd, 9);
  return { hist: macd.map((v, i) => v - sig[i]) };
}
function stochasticK(bars, period, smooth) {
  const last = bars.length - 1;
  if (bars.length < period + smooth) return null;
  const kVals = [];
  for (let j = last - smooth + 1; j <= last; j++) {
    const sl = bars.slice(j - period + 1, j + 1);
    const hi = Math.max(...sl.map(b => b.high)), lo = Math.min(...sl.map(b => b.low));
    kVals.push(hi === lo ? 50 : (bars[j].close - lo) / (hi - lo) * 100);
  }
  return kVals.reduce((a, b) => a + b, 0) / kVals.length; // 슬로우 %K (3일 평활)
}

function computeSignals(bars) {
  const closes = bars.map(b => b.close);
  const vols = bars.map(b => b.volume);
  const last = closes.length - 1;
  const price = closes[last];
  const sma = (p, idx = last) => idx + 1 >= p ? closes.slice(idx + 1 - p, idx + 1).reduce((a, b) => a + b, 0) / p : null;
  const sigs = [];

  // 1. RSI(14)
  const rsi = rsiWilder(closes, 14);
  if (rsi != null) sigs.push({
    grade: rsi < 30 ? 'buy' : rsi > 70 ? 'sell' : 'neutral',
    title: `RSI(14) = ${rsi.toFixed(1)}`,
    desc: rsi < 30 ? '30 미만 과매도 구간 — 단기 반등을 노리는 매수 관점 신호입니다.'
      : rsi > 70 ? '70 초과 과매수 구간 — 단기 조정 가능성이 있는 매도 관점 신호입니다.'
      : '중립 구간입니다 (30 미만이면 과매도→매수, 70 초과면 과매수→매도 관점).'
  });

  // 2. MACD(12,26,9)
  const { hist } = macdCalc(closes);
  if (hist.length > 6) {
    const h = hist[last];
    let cross = '';
    for (let i = last - 4; i <= last; i++) {
      if (i > 0 && hist[i - 1] <= 0 && hist[i] > 0) cross = ' 최근 5일 내 골든크로스(시그널선 상향돌파)가 발생했습니다!';
      if (i > 0 && hist[i - 1] >= 0 && hist[i] < 0) cross = ' 최근 5일 내 데드크로스(시그널선 하향돌파)가 발생했습니다.';
    }
    sigs.push({
      grade: h > 0 ? 'buy' : 'sell',
      title: `MACD(12,26,9) ${h > 0 ? '시그널선 위 — 상승 모멘텀' : '시그널선 아래 — 하락 모멘텀'}`,
      desc: `히스토그램(diff) ${h >= 0 ? '+' : ''}${h.toFixed(2)}.${cross} MACD선이 시그널선을 상향 돌파하면 매수, 하향 돌파하면 매도 신호로 봅니다.`
    });
  }

  // 3. 단기 이동평균 (5/20 크로스)
  const m5 = sma(5), m20 = sma(20), m60 = sma(60);
  if (m5 && m20) {
    const m5p = sma(5, last - 1), m20p = sma(20, last - 1);
    const cross = (m5p <= m20p && m5 > m20) ? ' 골든크로스가 막 발생했습니다!'
      : (m5p >= m20p && m5 < m20) ? ' 데드크로스가 막 발생했습니다.' : '';
    sigs.push({
      grade: m5 > m20 ? 'buy' : 'sell',
      title: `단기 추세: 5일선이 20일선 ${m5 > m20 ? '위' : '아래'}`,
      desc: `5일 이동평균 ${fmtPrice(m5, techState.item.symbol)} vs 20일선 ${fmtPrice(m20, techState.item.symbol)}.${cross} 단기선이 위면 상승 추세 지속으로 봅니다.`
    });
  }

  // 4. 중기 추세 (20/60 배열)
  if (m20 && m60) {
    const aligned = price > m20 && m20 > m60;
    const reversed = price < m20 && m20 < m60;
    sigs.push({
      grade: aligned ? 'buy' : reversed ? 'sell' : 'neutral',
      title: aligned ? '중기 정배열 (주가 > 20일선 > 60일선)' : reversed ? '중기 역배열 (주가 < 20일선 < 60일선)' : '중기 추세 전환 구간',
      desc: '정배열은 중기 상승 추세의 교과서적 형태, 역배열은 하락 추세입니다. 섞여 있으면 추세 전환 중일 수 있습니다.'
    });
  }

  // 5. 볼린저밴드(20, ±2σ)
  if (m20 && last >= 19) {
    const sl = closes.slice(last - 19, last + 1);
    const sd = Math.sqrt(sl.reduce((a, v) => a + (v - m20) ** 2, 0) / 20);
    const up = m20 + 2 * sd, lo = m20 - 2 * sd;
    const pctB = (price - lo) / ((up - lo) || 1) * 100;
    sigs.push({
      grade: price < lo ? 'buy' : price > up ? 'sell' : 'neutral',
      title: `볼린저밴드 %B = ${pctB.toFixed(0)}%`,
      desc: price < lo ? '하단 밴드(-2σ) 아래로 이탈 — 통계적 과매도, 반등 관점 매수 신호입니다.'
        : price > up ? '상단 밴드(+2σ) 위로 돌파 — 통계적 과열 구간입니다.'
        : `밴드 내부 ${pctB.toFixed(0)}% 위치 (0% 부근 과매도, 100% 부근 과매수).`
    });
  }

  // 6. Envelope (20일선 ±6%)
  if (m20) {
    const dev = (price / m20 - 1) * 100;
    sigs.push({
      grade: dev < -6 ? 'buy' : dev > 6 ? 'sell' : 'neutral',
      title: `Envelope(20일, ±6%) 이격도 ${dev >= 0 ? '+' : ''}${dev.toFixed(1)}%`,
      desc: dev < -6 ? '20일선 대비 6% 이상 하락 이탈 — 과매도 반등 관점 매수 신호입니다.'
        : dev > 6 ? '20일선 대비 6% 이상 상승 이탈 — 과열에 따른 조정 관점 매도 신호입니다.'
        : '20일선 ±6% 밴드 안의 정상 범위입니다. 밴드 이탈 시 평균 회귀를 노립니다.'
    });
  }

  // 7. 스토캐스틱 (14,3)
  const sto = stochasticK(bars, 14, 3);
  if (sto != null) sigs.push({
    grade: sto < 20 ? 'buy' : sto > 80 ? 'sell' : 'neutral',
    title: `스토캐스틱 %K(14,3) = ${sto.toFixed(1)}`,
    desc: sto < 20 ? '20 미만 과매도 구간 — 매수 관점 신호입니다.'
      : sto > 80 ? '80 초과 과매수 구간 — 매도 관점 신호입니다.'
      : '중립 구간입니다 (20 미만 과매도, 80 초과 과매수).'
  });

  // 8. 거래량 (20일 평균 대비)
  if (vols[last] > 0 && last >= 21) {
    const avg20 = vols.slice(last - 20, last).reduce((a, b) => a + b, 0) / 20;
    const ratio = avg20 ? vols[last] / avg20 : 1;
    const upDay = price >= closes[last - 1];
    sigs.push({
      grade: ratio >= 1.5 ? (upDay ? 'buy' : 'sell') : 'neutral',
      title: `거래량: 20일 평균의 ${(ratio * 100).toFixed(0)}%`,
      desc: ratio >= 1.5
        ? (upDay ? '상승하며 거래량 급증(150%↑) — 매수세 유입으로 추세 신뢰도가 높아집니다.'
                 : '하락하며 거래량 급증(150%↑) — 매도 압력이 강하다는 신호입니다.')
        : '평균 수준의 거래량입니다. 거래량이 평균의 150% 이상으로 늘 때 추세 신호의 신뢰도가 올라갑니다.'
    });
  }
  return sigs;
}

document.getElementById('refresh-btn').onclick = async () => {
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true;
  btn.style.opacity = '0.55';
  document.getElementById('updated-at').textContent = '갱신 중…';
  renderMarketNews();
  renderSymbolNews();
  await Promise.allSettled([renderMacro(true), (async () => renderWatchlist(true))()]);
  markUpdated();
  btn.disabled = false;
  btn.style.opacity = '';
};
function markUpdated() {
  document.getElementById('updated-at').textContent =
    new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
}

renderMacro();
renderWatchlist();
// 뉴스는 시세 요청과 겹치지 않게 약간 늦게 시작 (프록시 동시요청 제한 회피)
setTimeout(() => { renderMarketNews(); renderSymbolNews(); }, 700);
markUpdated();
</script>
